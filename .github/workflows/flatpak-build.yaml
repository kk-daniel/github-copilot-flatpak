name: Build Flatpak

on:
  push:
    branches: [ main ]
    tags:
      - "copilot-*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_ID: com.github.Copilot

# The published OSTree repo is read-modify-write over HTTP: publish restores
# the live Pages site, commits on top, and deploy overwrites it. Two
# overlapping publish runs would drop one release's objects, leaving
# clients that already pulled it unable to update.
concurrency:
  group: publish-${{ github.ref_type == 'tag' && 'tag' || github.ref }}
  cancel-in-progress: false

jobs:
  # Renovate can bump the release URL version but not the sha256/size Flatpak
  # extra-data needs. Resolve those from the GitHub release API and add the
  # metainfo release before the build jobs see a Renovate branch.
  post-renovate:
    runs-on: ubuntu-latest
    # Match on the group slug the branch ends with, not the whole name: with
    # separateMultipleMajor the majors arrive as renovate/major-<N>-<group>,
    # and an exact-name gate would silently skip them.
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/') && endsWith(github.head_ref, 'copilot')
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - name: Install updater dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Capture dependency version
        id: version-before
        run: echo "version=$("./${APP_ID}/update-release-metadata.py" --print-version)" >> "$GITHUB_OUTPUT"
      - name: Pin release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"./${APP_ID}/update-release-metadata.py"'
      - name: Update metainfo
        run: '"./${APP_ID}/update-metainfo.sh"'
      - name: Verify dependency version unchanged
        env:
          BEFORE: ${{ steps.version-before.outputs.version }}
        run: |
          set -eo pipefail
          after="$("./${APP_ID}/update-release-metadata.py" --print-version)"
          if [ "$after" != "$BEFORE" ]; then
            echo "Dependency version changed while refreshing pins: $BEFORE -> $after" >&2
            exit 1
          fi

      - name: Get last commit message
        id: last-commit
        run: |
          {
            echo "message=$(git log -1 --pretty=%s)"
            echo "author=$(git log -1 --pretty='%an <%ae>')"
            echo "author_name=$(git log -1 --pretty=%an)"
            echo "author_email=$(git log -1 --pretty=%ae)"
          } >> "$GITHUB_OUTPUT"
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_author: ${{ steps.last-commit.outputs.author }}
          commit_user_name: ${{ steps.last-commit.outputs.author_name }}
          commit_user_email: ${{ steps.last-commit.outputs.author_email }}
          commit_message: ${{ steps.last-commit.outputs.message }}
          commit_options: '--amend --no-edit'
          push_options: '--force'
          file_pattern: ${{ env.APP_ID }}/${{ env.APP_ID }}.yaml ${{ env.APP_ID }}/${{ env.APP_ID }}.metainfo.xml

  # update-release-metadata.py is otherwise only ever run by post-renovate,
  # inside a PR that automerges itself. Running it on every build keeps the
  # pins honest against the live release API -- a replaced asset or a hand edit
  # that drifted from it reddens CI here rather than failing installs later.
  verify-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: post-renovate
    if: >-
      always() && !cancelled() &&
      needs.post-renovate.result == 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install updater dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Manifest pins match the release API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          "./${APP_ID}/update-release-metadata.py"
          if ! git diff --exit-code -- "${APP_ID}/${APP_ID}.yaml"; then
            echo "::error::Manifest sha256/size do not match the github/app release assets. Run ./${APP_ID}/update-release-metadata.py and commit the result."
            exit 1
          fi

  extract-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      version-changed: ${{ steps.extract-version.outputs.version-changed }}
    needs: post-renovate
    if: >-
      always() && !cancelled() &&
      needs.post-renovate.result == 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Extract version
        id: extract-version
        run: |
          set -eo pipefail
          pattern='s#.*/github/app/releases/download/v\([0-9][0-9.]*\)/GitHub-Copilot-linux-x64\.deb.*#\1#p'
          VERSION="$(sed -n "$pattern" "${APP_ID}/${APP_ID}.yaml")"
          if [ -z "$VERSION" ]; then
            echo "Error: GitHub Copilot version is missing from the manifest" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          else
            OLD_VERSION="$(git show "$BEFORE:${APP_ID}/${APP_ID}.yaml" | sed -n "$pattern")"
            if [ "$OLD_VERSION" != "$VERSION" ]; then
              echo "version-changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "version-changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # One native build per architecture. Installing the result runs apply_extra
  # against that architecture's .deb, so both payloads are unpacked and checked
  # for real rather than only the one the runner happens to be.
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: read
    needs: extract-version
    if: >-
      always() && !cancelled() &&
      needs.extract-version.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup GPG
        env:
          GPG_KEY_GREP: ${{ vars.GPG_KEY_GREP }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -eo pipefail
          gpg --list-keys --with-keygrip
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | /usr/libexec/gpg-preset-passphrase --preset "$GPG_KEY_GREP"
          echo "$GPG_PRIVATE_KEY" > repo.private.gpg
          gpg --import --batch repo.private.gpg
          rm repo.private.gpg
      - name: Clean branch name
        id: clean-branch-name
        env:
          BRANCH: ${{ (github.ref_type == 'tag' && 'main') || github.head_ref || github.ref_name }}
        run: echo "branch=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
      - name: Build Flatpak
        id: build-flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          build-bundle: false
          upload-artifact: false
          manifest-path: ${{ env.APP_ID }}/${{ env.APP_ID }}.yaml
          branch: ${{ steps.clean-branch-name.outputs.branch }}
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ vars.GPG_KEY_ID }}
      # Bundled from the installation, not from the build repo. Flatpak never
      # downloads extra-data while installing a bundle -- it fails with "Extra
      # data missing in detached metadata" -- so the .deb has to travel inside
      # it, and only the installed commit carries it there. The Pages remote
      # has no such limit: installs from it fetch the .deb from GitHub.
      - name: Create bundle
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ steps.clean-branch-name.outputs.branch }}
        run: |
          flatpak --user remote-add --no-gpg-verify build-repo repo
          flatpak --user install --noninteractive build-repo "${APP_ID}//${BRANCH}"
          flatpak build-bundle --arch="$ARCH" "$HOME/.local/share/flatpak/repo" "${APP_ID}-${ARCH}.flatpak" --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo "$APP_ID" "$BRANCH"
      - name: Smoke test payload
        env:
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ steps.clean-branch-name.outputs.branch }}
        run: |
          # apply_extra already ran during the install above and fails hard if
          # the .deb cannot be unpacked or carries the other architecture's
          # binaries. This asserts the tree landed where copilot.sh execs it and
          # that the runtime satisfies every library the payload links, so an
          # upstream layout or dependency change fails the build instead of
          # shipping a launcher that dies at startup.
          set -eo pipefail
          loc="$(flatpak --user info --show-location "${APP_ID}//${BRANCH}")"
          root="$loc/files/extra/copilot"
          fail=0

          case "$ARCH" in
            x86_64) machine=62 ;;
            aarch64) machine=183 ;;
          esac

          for path in \
            bin/github \
            bin/git-credential-copilot \
            "lib/GitHub Copilot/native-plugins/libgithub_app_linux_pulse_plugin.so" \
            "lib/GitHub Copilot/libonnxruntime.so"
          do
            if [ ! -f "$root/$path" ]; then
              echo "ERROR: missing from payload: $path" >&2
              fail=1
            elif [ "$(od -An -tu2 -j18 -N2 --endian=little "$root/$path" | tr -d ' \n')" != "$machine" ]; then
              echo "ERROR: not a $ARCH ELF: $path" >&2
              fail=1
            fi
          done
          for path in bin/github bin/git-credential-copilot; do
            [ -x "$root/$path" ] || { echo "ERROR: $path is not executable" >&2; fail=1; }
          done
          [ -f "$root/lib/GitHub Copilot/app-extensions/catalog.json" ] \
            || { echo "ERROR: resource directory is incomplete" >&2; fail=1; }
          [ -e "$loc/files/lib/libayatana-appindicator3.so.1" ] \
            || { echo "ERROR: tray library missing from /app/lib" >&2; fail=1; }

          # Resolved inside the sandbox, against the runtime the app really
          # gets, rather than against whatever the CI image has on the host.
          # The script is single-quoted on purpose: it expands in the sandbox.
          # shellcheck disable=SC2016
          missing="$(flatpak run --command=bash "${APP_ID}//${BRANCH}" -c '
            shopt -s nullglob
            for f in /app/extra/copilot/bin/* /app/lib/libayatana-appindicator3.so.1 \
              "/app/extra/copilot/lib/GitHub Copilot/"*.so \
              "/app/extra/copilot/lib/GitHub Copilot/native-plugins/"*.so
            do
              ldd "$f" | grep "not found" | sed "s|^|$f: |"
            done
            command -v git >/dev/null || echo "git is not on PATH"
          ' 2>/dev/null)"
          if [ -n "$missing" ]; then
            printf 'ERROR: unresolved in the sandbox:\n%s\n' "$missing" >&2
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "Payload layout OK"
          exit "$fail"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_ID }}-${{ matrix.arch }}.flatpak
          path: ${{ env.APP_ID }}-${{ matrix.arch }}.flatpak
      # Tarred so the OSTree repo survives the artifact round trip intact:
      # upload-artifact drops empty directories such as tmp/, which ostree
      # expects to find when it opens the repo.
      - name: Pack OSTree repo
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -cf "repo-${ARCH}.tar" repo
      - name: Upload OSTree repo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1

  # Both architectures go into one repository, so a single remote serves
  # x86_64 and aarch64 alike. Each build's commits are already signed; this
  # merges them, regenerates the signed summary, and lays out the Pages site.
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: read
      checks: write
    needs: build
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup GPG
        env:
          GPG_KEY_GREP: ${{ vars.GPG_KEY_GREP }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -eo pipefail
          gpg --list-keys --with-keygrip
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PASSPHRASE" | /usr/libexec/gpg-preset-passphrase --preset "$GPG_KEY_GREP"
          echo "$GPG_PRIVATE_KEY" > repo.private.gpg
          gpg --import --batch repo.private.gpg
          rm repo.private.gpg
          rm -f repo.gpg
          gpg --export "$GPG_KEY_ID" > repo.gpg
      - name: Restore repository
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -eo pipefail
          BASE_URL="$(gh api "/repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          curl -o/dev/null -sf "${BASE_URL}summary" || exit 0
          ostree --repo=repo init --mode=archive
          ostree --repo=repo remote add github-copilot-flatpak "${BASE_URL%/}" --gpg-import=repo.gpg
          ostree --repo=repo pull --mirror github-copilot-flatpak --depth=-1
          # Keep only the main branch of each ref. runtime/ exists only once a
          # .Debug or other extension ref has been published, so test for it.
          for refs in repo/refs/heads/app repo/refs/heads/runtime; do
            if [ -d "$refs" ]; then
              find "$refs" -type f -not -name main -delete
            fi
          done
          curl -o repo/config -sf "${BASE_URL}config"
          rm -rf repo/*.trustedkeys.gpg repo/extensions repo/state repo/tmp
      - name: Download OSTree repos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repo-*
          path: build-repos
          merge-multiple: true
      - name: Merge architectures
        run: |
          set -eo pipefail
          [ -d repo ] || ostree --repo=repo init --mode=archive
          mkdir -p repo/tmp
          for archive in build-repos/repo-*.tar; do
            arch="$(basename "$archive" .tar)"
            arch="${arch#repo-}"
            mkdir -p "build-repos/$arch"
            tar -xf "$archive" -C "build-repos/$arch"
            # pull-local copies every ref with its detached metadata, so the
            # build job's commit signatures come across with the objects.
            ostree --repo=repo pull-local "build-repos/$arch/repo"
          done
          ostree --repo=repo refs
      - name: Update repo
        id: update-repo
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --generate-static-deltas --prune repo
      - name: Initialize github-pages
        id: init-github-pages
        run: |
          set -eo pipefail
          gpg_base64="$(base64 -w 0 repo.gpg)"
          cat > repo/github-copilot.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=GitHub Copilot
          Url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          Homepage=https://github.com/github/app
          GPGKey=$gpg_base64
          EOF
          cat > repo/index.html <<EOF
          <!DOCTYPE html>
          <html>
            <head><title>GitHub Copilot Flatpak Repository</title></head>
            <body>
              <h1>GitHub Copilot</h1>
              <p>This is an unofficial Flatpak repository for the GitHub Copilot app, for x86_64 and aarch64.</p>
              <pre>flatpak remote-add --if-not-exists github-copilot-flatpak https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/github-copilot.flatpakrepo
          flatpak install ${APP_ID}</pre>
            </body>
          </html>
          EOF
      - name: Upload repository as artifact (tags only)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 30
      - name: Save pages artifact
        id: save-repo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/
      - name: Publish check result
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        if: always()
        with:
          token: ${{ github.token }}
          name: Build Result
          conclusion: ${{ job.status }}
          output: |
            {
              "summary": "${{ job.status }}",
              "text_description": "Build flatpak: ${{ needs.build.result }}\nUpdate repo: ${{ steps.update-repo.conclusion }}\nInit github pages: ${{ steps.init-github-pages.conclusion }}\nSave repo: ${{ steps.save-repo.conclusion }}"
            }

  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build, publish, extract-version]
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success' &&
      needs.publish.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.ref_type != 'tag' &&
      needs.extract-version.outputs.version-changed == 'true'
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Download flatpak artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.flatpak"
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: copilot-${{ needs.extract-version.outputs.version }}
          files: "*.flatpak"
          overwrite_files: true
          body: "GitHub Copilot ${{ needs.extract-version.outputs.version }}"
          prerelease: true

  deploy:
    if: >-
      always() && !cancelled() &&
      github.ref_type == 'tag' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Download flatpak artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.flatpak"
          merge-multiple: true
      - name: Publish flatpak
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.flatpak"
          overwrite_files: true
          prerelease: false
      - name: Deploy github pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
